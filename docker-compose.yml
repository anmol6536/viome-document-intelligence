services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-changeme}
      FHIR_VALIDATOR_URL: http://validator:8090
    depends_on:
      - validator

  validator:
    build:
      context: .
      dockerfile: docker/validator/Dockerfile
    ports:
      - "8090:8090"
